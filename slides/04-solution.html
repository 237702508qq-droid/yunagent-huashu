<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P4 · 解决方案（三步）</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .head { position:absolute; left:140px; right:140px; top:96px; }
  .arch { position:absolute; left:140px; top:268px; width:640px; height:620px; background:#FFFFFF; padding:46px 48px; }
  .band { height:124px; display:flex; align-items:center; justify-content:space-between; padding:0 28px; }
  .band .nm { font-size:22px; font-weight:900; letter-spacing:.02em; }
  .band .tg { font-size:13px; letter-spacing:.08em; }
  .b1 { border:2px solid #161616; background:#FFFFFF; }
  .b1 .nm { color:#161616; } .b1 .tg { color:#525252; }
  .b2 { border:2px solid #0F62FE; background:#EDF5FF; }
  .b2 .nm { color:#002D9C; } .b2 .tg { color:#0F62FE; }
  .b3 { background:#002D9C; }
  .b3 .nm { color:#FFFFFF; } .b3 .tg { color:rgba(255,255,255,.78); }
  .ajump { height:58px; display:flex; align-items:center; justify-content:center; gap:12px; }
  .ajump span { font-size:13px; color:#0F62FE; letter-spacing:.12em; }
  .steps { position:absolute; left:902px; top:268px; width:878px; }
  .step { display:grid; grid-template-columns:96px 1fr; padding:38px 0 34px; border-top:1px solid #C6C6C6; }
  .step:last-child { border-bottom:1px solid #C6C6C6; }
  .step .no { font-size:40px; color:#0F62FE; line-height:1; }
  .step h3 { font-size:28px; font-weight:900; color:#161616; margin-bottom:14px; letter-spacing:.02em; }
  .step p { font-size:17px; line-height:1.8; color:#525252; max-width:700px; }
  .step p b { color:#161616; font-weight:700; }
</style>
</head>
<body>
  <div class="head">
    <div class="kick"><span class="sq"></span>解决方案 · 三步<span class="en mono">SOLUTION</span></div>
    <h2 class="h2">在 VDI 桌面中，启用<span class="acc">桌面记忆</span></h2>
  </div>

  <div class="arch">
    <div class="band b1"><span class="nm">桌面记录</span><span class="tg mono">采集 · 记录</span></div>
    <div class="ajump">
      <svg width="16" height="34" viewBox="0 0 16 34" fill="none"><path d="M8 0 V22 M2 17 L8 26 L14 17" stroke="#0F62FE" stroke-width="2.5"/></svg>
      <span class="mono">数据</span>
    </div>
    <div class="band b2"><span class="nm">形成记忆</span><span class="tg mono">Agent 可调用</span></div>
    <div class="ajump">
      <svg width="16" height="34" viewBox="0 0 16 34" fill="none"><path d="M8 0 V22 M2 17 L8 26 L14 17" stroke="#0F62FE" stroke-width="2.5"/></svg>
      <span class="mono">整理</span>
    </div>
    <div class="band b3"><span class="nm">形成个人上下文</span><span class="tg mono">提升成功率</span></div>
  </div>

  <div class="steps">
    <div class="step">
      <div class="no mono">01</div>
      <div>
        <h3>桌面记录</h3>
        <p>在 VDI 桌面中启用<b>桌面记忆</b>，即可采集用户在桌面中的操作信息，并记录下来。</p>
      </div>
    </div>
    <div class="step">
      <div class="no mono">02</div>
      <div>
        <h3>形成记忆</h3>
        <p>这些数据一方面可以被用户的 Agent 调用，让 Agent 具备了桌面中的<b>「记忆」</b>。</p>
      </div>
    </div>
    <div class="step">
      <div class="no mono">03</div>
      <div>
        <h3>形成个人上下文</h3>
        <p>另一方面可以借助模型的能力将其整理为<b>用户上下文</b>，提升 Agent 成功率（如：当前用户的岗位、工作边界、写作偏好等）。</p>
      </div>
    </div>
  </div>

  <div class="footer">
    <span>桌面记忆 · 客户价值方案</span>
    <span class="mono">04 / 07</span>
  </div>
</body>
</html>
