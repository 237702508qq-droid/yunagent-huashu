<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P1 · 封面 — 让云桌面里的 AI Agent 真正「懂你」</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .gridline { position:absolute; left:1056px; top:0; bottom:0; width:1px; background:#C6C6C6; }
  .lcol { position:absolute; left:140px; top:140px; width:840px; height:800px; }
  .label { display:flex; align-items:center; gap:14px; font-size:15px; letter-spacing:.18em; color:#161616;
           border-bottom:1px solid #C6C6C6; padding-bottom:22px; }
  .label .sq { width:12px; height:12px; background:#0F62FE; flex:none; }
  h1 { margin-top:64px; font-weight:900; font-size:64px; line-height:1.26; letter-spacing:.01em; color:#161616; }
  h1 .big { font-size:102px; line-height:1.14; letter-spacing:.01em; color:#0F62FE; }
  .sub { margin-top:36px; font-size:22px; color:#525252; letter-spacing:.04em; }
  .slogans { position:absolute; bottom:0; left:0; right:0; border-top:1px solid #C6C6C6; padding-top:28px; display:flex; }
  .slogans .it { flex:1; }
  .slogans .it + .it { border-left:1px solid #C6C6C6; padding-left:28px; margin-left:28px; }
  .slogans .no { font-size:14px; color:#0F62FE; letter-spacing:.1em; }
  .slogans .tx { margin-top:10px; font-size:19px; font-weight:700; color:#161616; }

  .tile { position:absolute; right:140px; top:140px; width:620px; height:800px;
          display:flex; flex-direction:column; align-items:center; justify-content:center; gap:34px; }
  .tile .cap { font-size:14px; letter-spacing:.14em; color:#525252; }
</style>
</head>
<body>
  <div class="gridline"></div>
  <span class="plus" style="left:1045px; top:128px;">+</span>
  <span class="plus" style="left:1045px; top:928px;">+</span>
  <span class="plus" style="left:128px;  top:928px;">+</span>

  <div class="lcol">
    <div class="label"><span class="sq"></span>桌面记忆 · 客户价值方案</div>
    <h1>让云桌面里的<br>AI Agent 真正<br><span class="big">「懂你」</span></h1>
    <div class="sub">基于 VDI 桌面记忆的 Agent 增强方案</div>
    <div class="slogans">
      <div class="it"><div class="no mono">01</div><div class="tx">不再「抽卡」</div></div>
      <div class="it"><div class="no mono">02</div><div class="tx">模糊指令可达成</div></div>
      <div class="it"><div class="no mono">03</div><div class="tx">数据属于企业</div></div>
    </div>
  </div>

  <div class="tile">
    <!-- 视觉母题：散落的操作痕迹 → 收敛 → 结构化个人上下文 -->
    <svg width="340" height="430" viewBox="0 0 340 430" fill="none">
      <rect x="30" y="14" width="280" height="152" stroke="#161616" stroke-width="3"/>
      <circle cx="74"  cy="62"  r="7" fill="#0F62FE"/>
      <circle cx="118" cy="98"  r="5" fill="#A8A8A8"/>
      <circle cx="152" cy="52"  r="8" fill="#0F62FE"/>
      <circle cx="196" cy="104" r="6" fill="#A8A8A8"/>
      <circle cx="238" cy="66"  r="7" fill="#0F62FE"/>
      <circle cx="272" cy="110" r="5" fill="#A8A8A8"/>
      <text x="46" y="146" font-family="Noto Sans Mono, monospace" font-size="13" fill="#525252" letter-spacing="2">VDI 桌面</text>
      <!-- 收敛漏斗 -->
      <path d="M60 176 L150 232 M280 176 L190 232 M170 176 L170 228" stroke="#C6C6C6" stroke-width="1.5"/>
      <path d="M170 232 v30 M162 252 L170 262 L178 252" stroke="#0F62FE" stroke-width="2.5"/>
      <!-- 结构化条目 -->
      <rect x="44" y="278" width="252" height="28" stroke="#0F62FE" stroke-width="2"/>
      <path d="M58 292 h120" stroke="#0F62FE" stroke-width="2"/>
      <rect x="44" y="318" width="216" height="28" stroke="#0F62FE" stroke-width="2"/>
      <path d="M58 332 h96" stroke="#0F62FE" stroke-width="2"/>
      <rect x="44" y="358" width="252" height="28" fill="#002D9C"/>
      <path d="M58 372 h132" stroke="#FFFFFF" stroke-width="2"/>
      <text x="44" y="416" font-family="Noto Sans Mono, monospace" font-size="13" fill="#525252" letter-spacing="2">个人上下文</text>
    </svg>
    <div class="cap mono">操作痕迹 → 收敛 → 个人上下文</div>
  </div>

  <div class="footer">
    <span>面向企业级云桌面环境</span>
    <span class="mono">2026</span>
  </div>
</body>
</html>
